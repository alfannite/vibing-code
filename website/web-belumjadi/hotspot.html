<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet | LKP Utama Jaya — Internet Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg1: #0a0f1e;
      --c-bg2: #0d1f3c;
      --c-bg3: #091428;
      --c-orb1: #1a4fd6;
      --c-orb2: #6c2bd9;
      --c-orb3: #0ea5e9;
      --c-glass-bg: rgba(255,255,255,0.06);
      --c-glass-border: rgba(255,255,255,0.13);
      --c-glass-hover: rgba(255,255,255,0.10);
      --c-text: #e8eeff;
      --c-text-muted: rgba(200,210,255,0.55);
      --c-input-bg: rgba(255,255,255,0.07);
      --c-input-border: rgba(255,255,255,0.15);
      --c-input-focus: rgba(99,160,255,0.45);
      --c-btn-from: #2563eb;
      --c-btn-to: #7c3aed;
      --c-accent: #60a5fa;
      --c-success: #34d399;
      --radius-card: 24px;
      --radius-input: 12px;
      --radius-btn: 50px;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--c-bg1);
      color: var(--c-text);
      overflow-x: hidden;
    }

    /* ── ANIMATED BACKGROUND ── */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, #0d2460 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #1a0b3d 0%, transparent 55%),
                  radial-gradient(ellipse at 60% 80%, #061838 0%, transparent 50%),
                  var(--c-bg1);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: min(500px, 80vw); height: min(500px, 80vw);
      top: -10%; left: -10%;
      background: radial-gradient(circle, var(--c-orb1), transparent 70%);
      animation-duration: 22s;
    }
    .orb-2 {
      width: min(450px, 70vw); height: min(450px, 70vw);
      bottom: -5%; right: -8%;
      background: radial-gradient(circle, var(--c-orb2), transparent 70%);
      animation-duration: 17s;
      animation-delay: -6s;
    }
    .orb-3 {
      width: min(300px, 55vw); height: min(300px, 55vw);
      top: 50%; left: 55%;
      background: radial-gradient(circle, var(--c-orb3), transparent 70%);
      opacity: 0.2;
      animation-duration: 25s;
      animation-delay: -12s;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(3%, 4%) scale(1.05); }
      66%  { transform: translate(-2%, 2%) scale(0.97); }
      100% { transform: translate(4%, -3%) scale(1.03); }
    }

    /* grid dots overlay */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
    }

    /* ── LAYOUT ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 5vw, 40px);
      gap: 24px;
    }

    /* ── BRAND HEADER ── */
    .brand {
      text-align: center;
      animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--c-btn-from), var(--c-btn-to));
      box-shadow: 0 8px 32px rgba(37,99,235,0.4);
      margin-bottom: 14px;
    }

    .brand-icon svg {
      width: 28px; height: 28px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--c-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      margin-top: 6px;
      font-size: clamp(12px, 3vw, 14px);
      font-weight: 300;
      color: var(--c-text-muted);
      letter-spacing: 0.3px;
    }

    /* ── GLASS CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--c-glass-bg);
      border: 1px solid var(--c-glass-border);
      border-radius: var(--radius-card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      padding: clamp(24px, 6vw, 40px);
      box-shadow:
        0 32px 64px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 1px 0 rgba(255,255,255,0.12) inset;
      animation: fadeUp 0.8s cubic-bezier(.22,1,.36,1) 0.1s both;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: clamp(17px, 4vw, 20px);
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .card-subtitle {
      font-size: clamp(12px, 3vw, 13px);
      color: var(--c-text-muted);
      margin-bottom: clamp(20px, 5vw, 28px);
      font-weight: 300;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(200,215,255,0.7);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(180,200,255,0.4);
      display: flex;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: var(--c-input-bg);
      border: 1px solid var(--c-input-border);
      border-radius: var(--radius-input);
      color: var(--c-text);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 400;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
    }

    input::placeholder {
      color: rgba(180,200,255,0.3);
    }

    input:focus {
      border-color: rgba(99,160,255,0.6);
      box-shadow: 0 0 0 3px var(--c-input-focus);
      background: rgba(255,255,255,0.10);
    }

    /* password toggle */
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(180,200,255,0.4);
      cursor: pointer;
      display: flex;
      padding: 4px;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--c-accent); }

    /* ── BUTTONS / LINKS AS BUTTONS ── */
    .btn-primary {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: var(--radius-btn);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
      background: linear-gradient(135deg, var(--c-btn-from) 0%, var(--c-btn-to) 100%);
      box-shadow: 0 4px 24px rgba(37,99,235,0.35), 0 1px 0 rgba(255,255,255,0.15) inset;
      margin-top: 24px;
      transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      border-radius: inherit;
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 32px rgba(37,99,235,0.5), 0 1px 0 rgba(255,255,255,0.2) inset;
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.99);
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 4px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .divider span {
      font-size: 11px;
      font-weight: 500;
      color: var(--c-text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── REPORT LINK ── */
    .btn-ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: var(--radius-btn);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: rgba(200,215,255,0.75);
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.18s;
      margin-top: 10px;
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-1px);
    }

    .btn-ghost svg {
      opacity: 0.7;
      flex-shrink: 0;
    }

    /* ── STATUS MESSAGE (dari MikroTik $(error)) ── */
    .status-msg {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 400;
      margin-bottom: 16px;
      line-height: 1.5;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
    }

    .status-msg.hidden { display: none; }

    /* ── FOOTER ── */
    .footer-note {
      font-size: 11px;
      color: var(--c-text-muted);
      text-align: center;
      opacity: 0.6;
      animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.25s both;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card { border-radius: 20px; }
    }

    @media (min-width: 900px) {
      .page {
        display: grid;
        grid-template-columns: 1fr 420px 1fr;
        grid-template-rows: auto;
        align-items: center;
      }
      .brand {
        grid-column: 2;
        grid-row: 1;
      }
      .card {
        grid-column: 2;
        grid-row: 2;
      }
      .footer-note {
        grid-column: 2;
        grid-row: 3;
      }
    }

    /* ── SHIMMER on card top border ── */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      border-radius: 50%;
    }
    .card { position: relative; }
  </style>
</head>
<body>

<div class="bg-scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="bg-grid"></div>
</div>

<div class="page">

  <!-- BRAND -->
  <div class="brand">
    <div class="brand-icon">
      <!-- Signal / wifi icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <div class="brand-name">[NAMA_PORTAL]</div>
    <div class="brand-tagline">Portal Internet · Masuk untuk mulai berselancar</div>
  </div>

  <!-- LOGIN CARD -->
  <div class="card">
    <div class="card-title">Selamat Datang 👋</div>
    <div class="card-subtitle">Masukkan kredensial kamu untuk terhubung</div>

    <!-- Error message placeholder (MikroTik variable) -->
    <div class="status-msg $(if error)show$(endif) $(if !error)hidden$(endif)" id="errMsg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>$(error)</span>
    </div>

    <form name="sendin" action="$(link-login-only)" method="post">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" id="username" name="username" placeholder="Masukkan username kamu" autocomplete="username" spellcheck="false" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Masukkan password kamu" autocomplete="current-password" />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan password">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- styled as pill button, but triggers form submit -->
      <a href="javascript:void(0)" class="btn-primary" onclick="document.sendin.submit()">
        Masuk ke Internet &nbsp;→
      </a>
    </form>

    <div class="divider"><span>atau</span></div>

    <a href="report.html" class="btn-ghost">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Laporkan Masalah Koneksi
    </a>
  </div>

  <!-- FOOTER -->
  <p class="footer-note">Dengan masuk, kamu menyetujui kebijakan penggunaan jaringan ini.</p>

</div>

<script>
  // Password show/hide toggle
  const pwInput = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  const eyeIcon = document.getElementById('eyeIcon');

  const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  const eyeOff  = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

  pwToggle.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden ? eyeOff : eyeOpen;
  });

  // Auto-focus username
  document.getElementById('username').focus();
</script>

</body>
</html>
