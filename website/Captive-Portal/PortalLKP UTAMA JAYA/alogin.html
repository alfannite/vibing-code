<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <title>Login Berhasil</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* subtle animated bg dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #ffffff08 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      width: 90%;
      max-width: 380px;
      animation: fadeUp 0.5s ease forwards;
      position: relative;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* checkmark icon */
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #22c55e18;
      border: 2px solid #22c55e55;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: popIn 0.4s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .checkmark {
      width: 32px;
      height: 32px;
      stroke: #22c55e;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.5s 0.6s ease forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    h1 {
      color: #f1f5f9;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .username {
      color: #22c55e;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    /* progress bar */
    .progress-wrap {
      background: #0f172a;
      border-radius: 99px;
      height: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 99px;
      animation: fillBar 2.2s 0.4s ease forwards;
    }

    @keyframes fillBar {
      to { width: 100%; }
    }

    .redirect-text {
      font-size: 12px;
      color: #475569;
      margin-bottom: 20px;
    }

    /* status button */
    .status-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .status-btn:hover {
      border-color: #22c55e55;
      color: #22c55e;
      background: #22c55e0d;
    }

    .status-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">
      <svg class="checkmark" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1>Login Berhasil!</h1>
    <p class="subtitle">
      Selamat datang, <span class="username">$(username)</span><br>
      Kamu sudah terhubung ke internet.
    </p>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <p class="redirect-text">Mengalihkan ke halaman utama...</p>

    <a href="$(link-status)" class="status-btn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Cek Status Internet
    </a>
  </div>

  <script>
    // popup status (dari MikroTik)
    $(if popup == 'true')
    open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290');
    $(endif)

    // redirect dengan delay 2.2 detik
    setTimeout(function () {
      location.href = 'https://lkputamajaya.net/';
    }, 2200);
  </script>

</body>
</html>
