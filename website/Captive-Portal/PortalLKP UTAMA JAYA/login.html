  <body data-spy="scroll" data-target="#navbar" data-offset="98">
    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post">
      <input type="hidden" name="username" />
      <input type="hidden" name="password" />
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
    </form>
    <script type="text/javascript" src="/md5.js"></script>
    <script type="text/javascript">
    <!--
        function doLogin() {
      document.sendin.username.value = document.login.username.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
      document.sendin.submit();
      return false;
        }
    //-->
    </script>
    $(endif)


    <div id="loading">
      <div class="load-circle"><span class="one"></span></div>
    </div>
    <header>
      <nav class="navbar header-nav navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img class="light-logo" src="static\img\logo-light.svg" title="" alt="">
            <img class="dark-logo" src="static\img\logo.svg" title="" alt="">
          </a>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
              <span></span>
              <span></span>
              <span></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbar">
            <ul class="navbar-nav ml-auto align-items-center">
              <li><a class="nav-link" href="#home">Home</a></li>
            </ul>
          </div>
        </div>
      </nav> 
    </header>

    <main>
      <section id="home" class="home-banner-03 theme-bg bg-effect-box">
        <div class="bg-effect bg-cover" style="background-image: url(static/img/banner-effect-6.svg);"></div>
        <div id="particles_effect" class="particles-effect"></div>
        <div class="container">
          <div class="row align-items-center justify-content-center p-100px-tb sm-p-60px-b">
            <div class="col-lg-5 md-p-30px-tb">
              <h5 class="white-color">LKP Utama Jaya</h5>
              <h1 class="font-alt white-color">Login WiFi</h1>
              <p class="p-descript white-color-light">Login ke WiFi, mulai langkah suksesmu di sini.</p>
              <div class="subscribe-block">
                  <div class="card-block py-lg px-md">
                    <form id="loginForm" class="md-form form-light" role="form" action="$(link-login-only)" method="post">
                        <input type="hidden" name="dst" value="$(link-orig)"/>
                        <input type="hidden" name="popup" value="true"/>
                      <div class="row">
                        <div class="col-md-6">
                          <div class="form-group">
                            <label for="inputUser" class="form-label">Username</label>
                            <div class="md-form-line-wrap">
                              <input id="inputUser" type="text" name="username" placeholder="Username" class="form-control" autofocus required>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="form-group">
                            <label for="inputPassword" class="form-label">Password</label>
                            <div class="md-form-line-wrap">
                              <input id="inputPassword" type="password" name="password" placeholder="Password" class="form-control" required>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-12">
                          <div class="form-group">
                            $(if error)
                              <p><font style="color: #ff0505e8">Password atau Username salah: </font>$(error)</p>
                            $(endif)
                          </div>
                        </div></br>
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-block btn-light"><span class="btn-elem-wrap"><span class="text" style="color: darkblue">LOGIN</span></span></button>
                        </div>
                      </div>
                    </form>
                  </div>
              </div>
            </div> 
            <div class="col-lg-7 text-center p-50px-l">
              <img src="static\img\home-banner-7.svg" title="" alt="">
            </div>
          </div> 
        </div>
      </section>
    </main>
